apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: php-demo
  namespace: php-observability-demo
  labels:
    app: php-demo
    app.kubernetes.io/name: php-demo
    app.kubernetes.io/part-of: php-observability-lab
spec:
  to:
    kind: Service
    name: php-demo
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
