apiVersion: batch/v1
kind: Job
metadata:
  name: create-tempo-bucket
  namespace: minio
  labels:
    app.kubernetes.io/name: minio-bucket-init
    app.kubernetes.io/part-of: php-observability-lab

spec:
  backoffLimit: 3

  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-bucket-init

    spec:
      restartPolicy: Never

      containers:
        - name: mc
          image: quay.io/rh-ee-imesquit/minio-community:latest
          imagePullPolicy: IfNotPresent

          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root-credentials
                  key: MINIO_ROOT_USER

            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root-credentials
                  key: MINIO_ROOT_PASSWORD

            - name: TEMPO_BUCKET
              value: tempo

          command:
            - /bin/sh
            - -ec
            - |
              MC_CONFIG_DIR="/tmp/mc"

              echo "Configuring MinIO alias..."

              /usr/local/bin/mc \
                --config-dir "${MC_CONFIG_DIR}" \
                alias set lab \
                http://minio.minio.svc.cluster.local:9000 \
                "${MINIO_ROOT_USER}" \
                "${MINIO_ROOT_PASSWORD}"

              echo "Creating Tempo bucket if necessary..."

              /usr/local/bin/mc \
                --config-dir "${MC_CONFIG_DIR}" \
                mb --ignore-existing \
                "lab/${TEMPO_BUCKET}"

              echo "Available buckets:"

              /usr/local/bin/mc \
                --config-dir "${MC_CONFIG_DIR}" \
                ls lab
